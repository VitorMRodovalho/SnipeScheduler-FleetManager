name: Auto Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          # Extract the section for this version from CHANGELOG.md.
          # Headers are "## [2.1.1] - <date>" (current) or "## v1.5.1 (<date>)" (older);
          # the tag is "v2.1.1". The section ends at the next "## " header.
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              if (index($0, "## [" ver "]") == 1 || index($0, "## v" ver " ") == 1 || $0 == "## v" ver) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md)
          # If no notes found, use a default message
          if [ -z "$NOTES" ]; then
            NOTES="Release ${GITHUB_REF_NAME} - See CHANGELOG.md for details."
          fi
          # Multiline output with a random delimiter, so a line in the notes cannot end the value early
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "NOTES<<${delimiter}"
            echo "$NOTES"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Zip the application
        run: |
          zip -r "SnipeScheduler-FleetManager-${GITHUB_REF_NAME}.zip" . \
            -x "*.git*" \
            -x ".github*" \
            -x "archive/*" \
            -x "*.bak"
            
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "SnipeScheduler FleetManager ${{ steps.get_version.outputs.VERSION }}"
          body: |
            ## What's New in ${{ steps.get_version.outputs.VERSION }}
            
            ${{ steps.changelog.outputs.NOTES }}
            
            ---
            
            **Installation:** See [INSTALLATION.md](docs/INSTALLATION.md)
            
            **Full Changelog:** See [CHANGELOG.md](CHANGELOG.md)
          files: SnipeScheduler-FleetManager-*.zip
          generate_release_notes: false
