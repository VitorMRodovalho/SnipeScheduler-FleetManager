name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    container: php:${{ matrix.php }}-cli
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint every PHP file
        run: |
          php -v | head -n 1
          find . -type f -name '*.php' -not -path './vendor/*' | sort > /tmp/php-files.txt
          echo "Files to lint: $(wc -l < /tmp/php-files.txt)"
          fail=0
          while IFS= read -r f; do
            out=$(php -d display_errors=1 -d error_reporting=-1 -l "$f" 2>&1) || fail=1
            # Print anything beyond the success line (errors, warnings, deprecations)
            [ "$out" = "No syntax errors detected in $f" ] || echo "$out"
          done < /tmp/php-files.txt
          exit $fail

  composer:
    name: Composer validate and audit
    runs-on: ubuntu-latest
    container: composer:2
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate composer.json and lock freshness
        run: composer validate --no-check-publish

      - name: Audit locked dependencies
        run: composer audit --locked

  npm-audit:
    name: npm audit (scripts/)
    runs-on: ubuntu-latest
    container: node:26-slim
    defaults:
      run:
        working-directory: scripts
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fail on high or critical advisories
        run: npm audit --audit-level=high
